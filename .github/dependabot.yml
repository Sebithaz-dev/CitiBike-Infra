version: 2
updates:
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, terraform]
    commit-message:
      prefix: "chore(tf)"
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker/prometheus
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker/grafana
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "grafana/grafana"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker/alertmanager
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "prom/alertmanager"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker/blackbox
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "prom/blackbox-exporter"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
