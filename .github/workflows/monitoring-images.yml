name: Monitoring Images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/monitoring-images.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/monitoring-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: monitoring-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [prometheus, grafana, alertmanager, blackbox]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR (solo push a main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/sebithaz-dev/citibike-${{ matrix.image }}:latest
            ghcr.io/sebithaz-dev/citibike-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sebithaz-dev/CitiBike-Infra
            org.opencontainers.image.description=Stack de observabilidad CitiBike EP3
            org.opencontainers.image.revision=${{ github.sha }}
