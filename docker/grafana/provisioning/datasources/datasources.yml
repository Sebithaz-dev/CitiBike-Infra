apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Credenciales del task role (LabRole) via container credentials: no hay
  # claves estaticas ni IRSA.
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    editable: false
    jsonData:
      authType: default
      defaultRegion: us-east-1
