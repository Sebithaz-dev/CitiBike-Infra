global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # La demo no envia correo: las alertas se visualizan en Prometheus/Grafana.
  # Para produccion se agregaria un receiver de email/Slack.
  - name: default

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
